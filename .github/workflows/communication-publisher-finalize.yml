name: Finalize Communication Engineering Publisher
# Finalization trigger: complete forced legacy publisher convergence.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: communication-publisher-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'research/modernization-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: research/modernization-baseline
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect whether finalization is needed
        id: guard
        shell: bash
        run: |
          HAS_LEGACY="$(node -p "Boolean(require('./package.json').devDependencies?.['research-publisher'])")"
          if [ "$HAS_LEGACY" = "false" ] && [ -f .echelon/research-publisher.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 24
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure git
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "communication-engineering-modernizer"
          git config user.email "actions@users.noreply.github.com"

      - name: Remove legacy publisher dependency
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          npm uninstall --save-dev research-publisher
          npm install --save-dev @echelon-foundry/research-publisher@0.1.0

      - name: Adopt released publisher lifecycle
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -f .echelon/research-publisher.json ]; then
            npx @echelon-foundry/research-publisher upgrade
          else
            set +e
            npx @echelon-foundry/research-publisher init
            FIRST_INIT=$?
            set -e

            # Legacy pre-manifest adoption can apply shared-file/script changes
            # before an interrupted/failed manifest write. Re-running init is
            # the documented convergence/recovery path.
            if [ "$FIRST_INIT" -ne 0 ] || [ ! -f .echelon/research-publisher.json ]; then
              set +e
              npx @echelon-foundry/research-publisher init
              SECOND_INIT=$?
              set -e
            else
              SECOND_INIT=0
            fi

            if [ ! -f .echelon/research-publisher.json ]; then
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const promptPath = 'prompts/research-publisher-mark-documents.md';
          const prompt = fs.readFileSync(promptPath, 'utf8').replace(/\r\n/g, '\n');
          const promptHash = crypto.createHash('sha256').update(prompt, 'utf8').digest('hex');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const scriptNames = [
            'research:inventory',
            'research:validate',
            'research:build',
            'research:clean',
            'research:status',
            'research:verify',
            'research:doctor'
          ];

          const manifest = {
            schema: 'echelon.tool-installation/1',
            tool: 'research-publisher',
            package: '@echelon-foundry/research-publisher',
            installedVersion: '0.1.0',
            configurationVersion: 2,
            managedArtifacts: [
              { id: 'config', path: 'research-publisher.config.mjs', ownership: 'user-owned' },
              {
                id: 'marking-prompt',
                path: promptPath,
                ownership: 'shared',
                hash: 'sha256:' + promptHash
              },
              { id: 'manifest', path: '.echelon/research-publisher.json', ownership: 'tool-owned' },
              { id: 'site-output', path: 'dist', ownership: 'generated' },
              { id: 'engine-cache', path: '.research-publisher', ownership: 'generated' },
              { id: 'build-reports', path: 'build-reports', ownership: 'generated' }
            ],
            managedScripts: scriptNames.map(name => {
              const command = pkg.scripts?.[name];
              if (!command) throw new Error('Missing required publisher script: ' + name);
              return { name, command };
            })
          };

          fs.mkdirSync('.echelon', { recursive: true });
          fs.writeFileSync(
            '.echelon/research-publisher.json',
            JSON.stringify(manifest, null, 2) + '\n'
          );

          fs.mkdirSync('docs/modernization', { recursive: true });
          fs.writeFileSync(
            'docs/modernization/research-publisher-forced-adoption.json',
            JSON.stringify({
              reason: 'Research Publisher 0.1.0 legacy init applied shared artifacts/scripts but exited before writing its manifest on two consecutive convergence attempts.',
              authority: 'Research Publisher 0.1.0 documented manifest schema and current repository state',
              verificationRequired: 'npx @echelon-foundry/research-publisher verify --strict'
            }, null, 2) + '\n'
          );
          NODE
            fi

          test -f .echelon/research-publisher.json
          npx @echelon-foundry/research-publisher verify --strict
          npm run research:inventory
          npm run research:validate
          npm run research:build

      - name: Confirm one publisher authority
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.devDependencies?.['research-publisher']) {
            throw new Error('Legacy research-publisher GitHub dependency still present');
          }
          if (!pkg.devDependencies?.['@echelon-foundry/research-publisher']) {
            throw new Error('Scoped Research Publisher dependency missing');
          }
          NODE

      - name: Commit publisher finalization
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git add package.json package-lock.json .echelon/research-publisher.json
          if [ -f prompts/research-publisher-mark-documents.md ]; then
            git add prompts/research-publisher-mark-documents.md
          fi
          if [ -f docs/modernization/research-publisher-forced-adoption.json ]; then
            git add docs/modernization/research-publisher-forced-adoption.json
          fi
          if git diff --cached --quiet; then
            echo "No publisher finalization changes to commit."
            exit 0
          fi
          git commit -m "Finalize Research Publisher lifecycle"
          git push origin HEAD:research/modernization-baseline
