name: Build research site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-research-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Communication Engineering context
        run: npm run context:validate

      - name: Test Communication preflight prototype
        run: npm run preflight:prototype:test

      - name: Set up .NET 8 for F# preflight prototype
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build F# Communication preflight prototype
        run: dotnet build research/prototypes/communication-preflight-fsharp-v0.1/src/CommunicationPreflight.fsproj --configuration Release

      - name: Test F# Communication preflight prototype
        run: dotnet run --project research/prototypes/communication-preflight-fsharp-v0.1/tests/CommunicationPreflight.Tests.fsproj --configuration Release

      - name: Validate research content
        run: npm run research:validate

      - name: Build research site
        run: npm run research:build
