name: Communication Engineering lifecycle

on:
  pull_request:
  push:
    branches:
      - main
      - work/gh-5-lifecycle-installer

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run context:validate
      - run: npm run test:lifecycle
      - name: Exercise the packed artifact in a clean repository
        shell: bash
        run: |
          TARBALL="$(npm pack --silent)"
          PACKAGE_PATH="$PWD/$TARBALL"
          ROOT="$(mktemp -d)"
          git -C "$ROOT" init -q
          npm exec --yes --package="$PACKAGE_PATH" communication-engineering -- init --root "$ROOT"
          npm exec --yes --package="$PACKAGE_PATH" communication-engineering -- verify --strict --root "$ROOT"
          npm exec --yes --package="$PACKAGE_PATH" communication-engineering -- init --check --root "$ROOT"
          test -f "$ROOT/.echelon/communication-engineering.json"
          test -f "$ROOT/.communication-engineering/COMMUNICATION-FOUNDATIONS.md"
      - run: npm pack --dry-run

  echelon-capability-rollout:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore carrier
        run: |
          git fetch origin main
          git checkout origin/main -- ".github/workflows/communication-engineering-lifecycle.yml"
      - name: Install SDE 1.3.0
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/state-directed-engineering.git "$RUNNER_TEMP/sde-source"
          (cd "$RUNNER_TEMP/sde-source/distribution" && npm run build:payload)
          if [[ -d .sde || -f .echelon/sde.json ]]; then cmd=upgrade; else cmd=init; fi
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- "$cmd"
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
      - name: Install ROS 3.1.1
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/repository-operating-system.git "$RUNNER_TEMP/ros-source"
          if [[ -f .echelon/ros.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          elif [[ -f .ros/installation.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- upgrade
          else
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          fi
      - name: Install Visual Engineering 1.0.0
        run: |
          if [[ -f .echelon/visual-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/visual-engineering@1.0.0 "$cmd"
      - name: Install Communication Engineering 1.0.0
        run: |
          git clone --depth 1 https://github.com/kemiller2002/communication-engineering.git "$RUNNER_TEMP/communication-engineering-source"
          if [[ -f .echelon/communication-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" "$cmd"
      - name: Install Limen 0.6.1
        run: |
          if [[ ! -f limen.config.json ]]; then
            printf '%s\n' '{"configurationVersion":1,"boundary":{"engine":[],"kernel":[]}}' > limen.config.json
          fi
          if [[ -f .echelon/limen.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 "$cmd"
      - name: Verify combined final state
        run: |
          set -euo pipefail
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- verify --strict
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 verify --strict
      - name: Commit rollout
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/echelon-capability-upgrade.yml .echelon-rollout-trigger
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: install current Echelon engineering capabilities"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
