name: Communication Engineering lifecycle

on:
  pull_request:
  push:
    branches:
      - main
      - work/gh-5-lifecycle-installer

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run context:validate
      - run: npm run test:lifecycle
      - run: npm pack --dry-run
