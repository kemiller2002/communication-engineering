name: Copilot Auto Model Probe

on:
  workflow_dispatch:
permissions:
  contents: read
  copilot-requests: write

jobs:
  probe-auto:
    if: github.head_ref == 'research/independent-preflight-replication-06' || github.ref_name == 'research/independent-preflight-replication-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @github/copilot
      - name: Probe auto-selected model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: /tmp/copilot-otel.jsonl
        run: |
          copilot -p "Reply with exactly AVAILABLE." --model auto

          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/copilot-otel.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);

          const targetKeys = new Set([
            'gen_ai.request.model',
            'gen_ai.response.model',
            'gen_ai.provider.name'
          ]);

          const found = [];

          function walk(value, path = '') {
            if (Array.isArray(value)) {
              value.forEach((item, i) => walk(item, path + '[' + i + ']'));
              return;
            }
            if (!value || typeof value !== 'object') return;

            for (const [key, child] of Object.entries(value)) {
              const next = path ? path + '.' + key : key;
              if (targetKeys.has(key)) {
                found.push({ key, value: child, path: next });
              }
              walk(child, next);
            }
          }

          for (const line of lines) {
            try { walk(JSON.parse(line)); } catch {}
          }

          console.log('MODEL_TRACE_BEGIN');
          console.log(JSON.stringify(found, null, 2));
          console.log('MODEL_TRACE_END');

          if (!found.some(x => x.key === 'gen_ai.response.model')) {
            process.exitCode = 2;
          }
          NODE
