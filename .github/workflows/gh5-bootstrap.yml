name: GH-5 ROS bootstrap

on:
  push:
    branches:
      - work/gh-5-lifecycle-installer

permissions:
  contents: write

jobs:
  start:
    if: ${{ !contains(github.event.head_commit.message, '[gh5-started]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Register and start governed work
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros add "Add installable Communication Engineering lifecycle capability (#5)" --id CE-LIFECYCLE-001 --tag communication-engineering,lifecycle --priority high
          ./ros work backlog-transition --action ready --id CE-LIFECYCLE-001 --occurred-at "$NOW"
          ./ros work start --id CE-LIFECYCLE-001 --occurred-at "$NOW" --type feature --actor ChatGPT
          ./ros work context CE-LIFECYCLE-001
      - name: Commit governed work state and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gh5-bootstrap.yml
          git add .ros .github/workflows || true
          git commit -m "chore: start CE lifecycle work under ROS [gh5-started]"
          git push
