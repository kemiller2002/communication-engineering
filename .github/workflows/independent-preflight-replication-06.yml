name: Independent Communication Preflight Replication 06

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: independent-preflight-replication-06
  cancel-in-progress: false

jobs:
  replicate:
    if: github.head_ref == 'research/independent-preflight-replication-06' || github.ref_name == 'research/independent-preflight-replication-06'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out replication branch
        uses: actions/checkout@v4
        with:
          ref: research/independent-preflight-replication-06
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard completed replication
        id: guard
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-06"
          if [ -f "$BASE/condition-a-first-pass.md" ] && [ -f "$BASE/condition-b-first-pass.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GitHub Copilot CLI
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Build frozen prompts
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-06"

          cat "$BASE/condition-a-instruction.md" "$BASE/task.md"             > /tmp/condition-a-prompt.md

          {
            cat "$BASE/condition-b-instruction.md"
            echo
            echo "# Communication Engineering operational context"
            for file in               agent-context/COMMUNICATION-FOUNDATIONS.md               agent-context/COMMUNICATION-DECISION-CHECKLIST.md               agent-context/PURPOSE-OUTCOME-MATRIX.md               agent-context/COMMUNICATION-ANTI-PATTERNS.md               agent-context/RESEARCH-STATUS.md
            do
              echo
              echo "## SOURCE: $file"
              cat "$file"
            done
            echo
            cat "$BASE/task.md"
          } > /tmp/condition-b-prompt.md

      - name: Generate Condition A with Claude Sonnet 4.6
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BASE="experiments/independent-preflight-replication-06"
          copilot -p "$(cat /tmp/condition-a-prompt.md)"             -s             --model claude-sonnet-4.6             > "$BASE/condition-a-first-pass.md"

          test -s "$BASE/condition-a-first-pass.md"

      - name: Generate Condition B with Claude Sonnet 4.6
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BASE="experiments/independent-preflight-replication-06"
          copilot -p "$(cat /tmp/condition-b-prompt.md)"             -s             --model claude-sonnet-4.6             > "$BASE/condition-b-first-pass.md"

          test -s "$BASE/condition-b-first-pass.md"

      - name: Freeze execution metadata
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-06"
          A_SHA="$(sha256sum "$BASE/condition-a-first-pass.md" | awk '{print $1}')"
          B_SHA="$(sha256sum "$BASE/condition-b-first-pass.md" | awk '{print $1}')"

          cat > "$BASE/first-pass-freeze.md" <<EOF
          # Independent replication 06 first-pass freeze

          Status: Frozen before scoring
          Date: 2026-09-20

          - Provider surface: GitHub Copilot CLI
          - Explicit model: `claude-sonnet-4.6`
          - Condition execution: separate stateless CLI invocations
          - Condition A SHA-256: `$A_SHA`
          - Condition B SHA-256: `$B_SHA`
          - Prior experiment outputs supplied to model: no
          - Scoring/preregistration supplied to model: no
          - Communication Engineering context supplied to A: no
          - Communication Engineering context supplied to B: yes
          EOF

      - name: Commit frozen outputs
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "communication-engineering-replication"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/independent-preflight-replication-06/
          git commit -m "Freeze independent preflight replication 06 outputs [claude-sonnet-4.6]"
          git push origin HEAD:research/independent-preflight-replication-06
