name: Modernize Communication Engineering

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/modernization-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: communication-engineering-modernization
  cancel-in-progress: false

jobs:
  modernize:
    if: github.head_ref == 'research/modernization-baseline' || github.ref == 'refs/heads/research/modernization-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: research/modernization-baseline
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if modernization was already applied
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[modernization-applied]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 24
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure git identity
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "communication-engineering-modernizer"
          git config user.email "actions@users.noreply.github.com"

      - name: Create safety tag
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          TAG="communication-engineering-pre-modernization-2026-09-20"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

      - name: Record protected corpus baseline
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p /tmp/communication-modernization
          {
            find research missions -type f -print0
            printf '%s\0' prompts/communication-engineering-comparative-writer-analysis-prompt.md
          } | sort -z | xargs -0 sha256sum > /tmp/communication-modernization/protected-before.sha256

      - name: Baseline validation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          ./ros registry build
          ./ros registry check
          ./ros validate
          npm ci
          npm run research:validate
          npm run research:build

      - name: Prepare forced ROS legacy replacement
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p docs/modernization

          node <<'NODE'
          const fs = require('fs');
          const legacy = JSON.parse(fs.readFileSync('.ros/installation.json', 'utf8'));
          const forcedPaths = [
            'AGENTS.md',
            'BOOTSTRAP.md',
            'ros',
            'docs/00-governance/README.md',
            'docs/00-governance/AI-Repository-Operating-System.md',
            'docs/00-governance/Agent-Operating-Manual.md',
            'docs/00-governance/Engineering-Standards.md',
            'docs/00-governance/Governance-Decision-Log.md'
          ];

          if (legacy.package !== '@kemiller2002/repository-operating-system' ||
              legacy.package_version !== '1.0.0') {
            throw new Error(`Unexpected legacy ROS identity: ${legacy.package}@${legacy.package_version}`);
          }

          const byPath = new Map(legacy.files.map(x => [x.path, x]));
          for (const path of forcedPaths) {
            const item = byPath.get(path);
            if (!item || item.managed !== true || item.disposition !== 'installed') {
              throw new Error(`Refusing forced replacement for ${path}: not recorded as installed+managed by legacy ROS`);
            }
          }

          fs.writeFileSync(
            'docs/modernization/forced-ros-legacy-replacement.json',
            JSON.stringify({
              authority: '.ros/installation.json',
              legacyPackage: legacy.package,
              legacyVersion: legacy.package_version,
              forcedPaths: forcedPaths.map(path => ({
                path,
                recordedSha256: byPath.get(path).sha256
              }))
            }, null, 2) + '\n'
          );
          NODE

          sha256sum \
            AGENTS.md \
            BOOTSTRAP.md \
            ros \
            docs/00-governance/README.md \
            docs/00-governance/AI-Repository-Operating-System.md \
            docs/00-governance/Agent-Operating-Manual.md \
            docs/00-governance/Engineering-Standards.md \
            docs/00-governance/Governance-Decision-Log.md \
            > docs/modernization/forced-ros-legacy-current-hashes.sha256

          rm -f \
            AGENTS.md \
            BOOTSTRAP.md \
            ros \
            docs/00-governance/README.md \
            docs/00-governance/AI-Repository-Operating-System.md \
            docs/00-governance/Agent-Operating-Manual.md \
            docs/00-governance/Engineering-Standards.md \
            docs/00-governance/Governance-Decision-Log.md

      - name: Inspect ROS 3.0.3 migration
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p docs/modernization
          cp .ros/installation.json /tmp/communication-modernization/legacy-installation.json

          set +e
          npx --yes --package=@echelon-foundry/repository-operating-system@3.0.3 ros status --json             > docs/modernization/ros-status-before.json
          STATUS_CODE=$?
          npx --yes --package=@echelon-foundry/repository-operating-system@3.0.3 ros doctor --json             > docs/modernization/ros-doctor-before.json
          DOCTOR_CODE=$?
          npx --yes --package=@echelon-foundry/repository-operating-system@3.0.3 ros upgrade --dry-run --json             > docs/modernization/ros-upgrade-plan.json
          UPGRADE_CODE=$?
          set -e

          echo "ROS status exit: $STATUS_CODE"
          echo "ROS doctor exit: $DOCTOR_CODE"

          if [ "$UPGRADE_CODE" -eq 0 ]; then
            echo "ros_legacy_identity_shim=false" >> "$GITHUB_ENV"
            exit 0
          fi

          LEGACY_PACKAGE="$(node -p "JSON.parse(require('fs').readFileSync('.ros/installation.json','utf8')).package")"
          if [ "$UPGRADE_CODE" -eq 5 ] && [ "$LEGACY_PACKAGE" = "@kemiller2002/repository-operating-system" ]; then
            echo "Testing legacy package-identity compatibility shim."
            node - <<'NODE'
const fs = require('fs');
const path = '.ros/installation.json';
const data = JSON.parse(fs.readFileSync(path, 'utf8'));
data.package = '@echelon-foundry/repository-operating-system';
fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
NODE

            set +e
            npx --yes --package=@echelon-foundry/repository-operating-system@3.0.3 ros upgrade --dry-run --json               > docs/modernization/ros-upgrade-plan-legacy-identity-shim.json
            SHIM_CODE=$?
            set -e

            if [ "$SHIM_CODE" -eq 0 ]; then
              echo "ros_legacy_identity_shim=true" >> "$GITHUB_ENV"
              exit 0
            fi

            cp /tmp/communication-modernization/legacy-installation.json .ros/installation.json
            echo "ROS legacy identity shim did not produce a valid migration plan."
            cat docs/modernization/ros-upgrade-plan-legacy-identity-shim.json || true
            exit "$SHIM_CODE"
          fi

          echo "ROS upgrade dry-run failed with exit $UPGRADE_CODE"
          cat docs/modernization/ros-upgrade-plan.json || true
          exit "$UPGRADE_CODE"

      - name: Upgrade ROS to 3.0.3
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          npx --yes --package=@echelon-foundry/repository-operating-system@3.0.3 ros upgrade

          if [ "$ros_legacy_identity_shim" = "true" ]; then
            cp /tmp/communication-modernization/legacy-installation.json .ros/installation.json
          fi

          ./ros status --json > docs/modernization/ros-status-after.json
          ./ros verify --json > docs/modernization/ros-verify-after.json
          ./ros doctor --json > docs/modernization/ros-doctor-after.json || true
          ./ros registry build
          ./ros registry check
          ./ros validate

      - name: Install released Research Publisher
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          npm install --save-dev @echelon-foundry/research-publisher@0.1.0

      - name: Inspect Research Publisher migration
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          npx @echelon-foundry/research-publisher status --json             > docs/modernization/research-publisher-status-before.json
          STATUS_CODE=$?
          npx @echelon-foundry/research-publisher doctor --json             > docs/modernization/research-publisher-doctor-before.json
          DOCTOR_CODE=$?
          npx @echelon-foundry/research-publisher upgrade --dry-run --json             > docs/modernization/research-publisher-upgrade-plan.json
          PLAN_CODE=$?
          set -e
          echo "Research Publisher status exit: $STATUS_CODE"
          echo "Research Publisher doctor exit: $DOCTOR_CODE"

          if [ "$PLAN_CODE" -eq 0 ]; then
            echo "mode=upgrade" >> "$GITHUB_ENV"
          elif [ "$PLAN_CODE" -eq 4 ]; then
            npx @echelon-foundry/research-publisher init --dry-run --json               > docs/modernization/research-publisher-init-plan.json
            echo "mode=init" >> "$GITHUB_ENV"
          else
            echo "Research Publisher lifecycle dry-run failed with exit $PLAN_CODE"
            exit "$PLAN_CODE"
          fi

      - name: Apply Research Publisher lifecycle
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "$mode" = "upgrade" ]; then
            npx @echelon-foundry/research-publisher upgrade
          else
            npx @echelon-foundry/research-publisher init
          fi

          npx @echelon-foundry/research-publisher status --json             > docs/modernization/research-publisher-status-after.json
          npx @echelon-foundry/research-publisher verify --strict --json             > docs/modernization/research-publisher-verify-after.json

          npm run research:inventory
          npm run research:validate
          npm run research:build

      - name: Verify protected corpus is unchanged
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          {
            find research missions -type f -print0
            printf '%s\0' prompts/communication-engineering-comparative-writer-analysis-prompt.md
          } | sort -z | xargs -0 sha256sum > /tmp/communication-modernization/protected-after.sha256

          if ! diff -u             /tmp/communication-modernization/protected-before.sha256             /tmp/communication-modernization/protected-after.sha256; then
            echo "Protected canonical research changed during tooling modernization."
            exit 1
          fi

          cp /tmp/communication-modernization/protected-before.sha256             docs/modernization/protected-corpus.sha256

      - name: Final validation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          ./ros registry build
          ./ros registry check
          ./ros validate
          ./ros verify
          npm run research:validate
          npm run research:build
          npx @echelon-foundry/research-publisher verify --strict

      - name: Write tooling upgrade report
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          START_SHA="$(git rev-parse communication-engineering-pre-modernization-2026-09-20)"
          cat > docs/modernization/communication-engineering-tooling-upgrade-report.md <<EOF
          # Communication Engineering Tooling Upgrade Report

          Status: completed by repository lifecycle tooling
          Date: 2026-09-20

          ## Safety baseline

          - Pre-modernization tag: `communication-engineering-pre-modernization-2026-09-20`
          - Starting SHA: `$START_SHA`
          - Protected corpus inventory: `docs/modernization/protected-corpus.sha256`

          ## ROS

          - Before: legacy ROS 1.0.0 installation recorded in `.ros/installation.json`
          - Target/current lifecycle package: `@echelon-foundry/repository-operating-system@3.0.3`
          - Dry-run: `docs/modernization/ros-upgrade-plan.json`
          - Status/verification evidence is stored beside this report.

          ## Research Publisher

          - Before: GitHub-sourced dependency with pre-manifest lifecycle shape
          - Target/current released package: `@echelon-foundry/research-publisher@0.1.0`
          - Lifecycle plan and verification evidence are stored beside this report.

          ## Corpus preservation

          The SHA-256 inventory for `research/**`, `missions/**`, and the original comparative-writing source mandate matched before and after modernization.

          No canonical research content was changed by the tooling migration.

          ## Validation

          The workflow completed:

          - ROS registry build/check/validate
          - ROS lifecycle verify
          - Research Publisher inventory/validate/build
          - Research Publisher strict lifecycle verify
          - protected-corpus hash comparison

          A successful workflow run is the executable evidence for this report.

          ## Scope

          This migration modernizes repository tooling only.

          It does not promote Communication Engineering theory, accept review-stage research, or claim that Communication Engineering is a validated universal discipline.

          ## Next mission

          Build and test the evidence-bounded Communication Engineering operational context described in:

          `docs/communication-engineering-modernization-baseline.md`
          EOF

      - name: Commit modernization
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No modernization changes to commit."
            exit 0
          fi
          git commit -m "Modernize Communication Engineering tooling [modernization-applied]"
          git push origin HEAD:research/modernization-baseline
