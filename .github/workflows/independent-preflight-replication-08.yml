name: Independent Compact Communication Preflight Replication 08

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: independent-preflight-replication-08
  cancel-in-progress: false

jobs:
  replicate:
    if: github.head_ref == 'research/independent-preflight-replication-06' || github.ref_name == 'research/independent-preflight-replication-06'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out replication branch
        uses: actions/checkout@v4
        with:
          ref: research/independent-preflight-replication-06
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard completed replication
        id: guard
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-08"
          if [ -f "$BASE/condition-a-first-pass.md" ] && [ -f "$BASE/condition-b-first-pass.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GitHub Copilot CLI
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Build frozen prompts
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-08"

          cat "$BASE/condition-a-instruction.md" "$BASE/task.md"             > /tmp/condition-a-prompt.md

          cat "$BASE/condition-b-instruction.md"               "$BASE/compact-preflight-context.md"               "$BASE/task.md"             > /tmp/condition-b-prompt.md

          wc -w /tmp/condition-a-prompt.md /tmp/condition-b-prompt.md             > "$BASE/prompt-word-counts.txt"

      - name: Generate Condition A
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: /tmp/condition-a-otel.jsonl
        run: |
          BASE="experiments/independent-preflight-replication-08"
          copilot             -p "$(cat /tmp/condition-a-prompt.md)"             -s             --model auto             --no-custom-instructions             --disable-builtin-mcps             --no-ask-user             > "$BASE/condition-a-first-pass.md"

          test -s "$BASE/condition-a-first-pass.md"
          node scripts/extract-copilot-model.mjs /tmp/condition-a-otel.jsonl             > "$BASE/condition-a-model.json"

      - name: Generate Condition B
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: /tmp/condition-b-otel.jsonl
        run: |
          BASE="experiments/independent-preflight-replication-08"
          copilot             -p "$(cat /tmp/condition-b-prompt.md)"             -s             --model auto             --no-custom-instructions             --disable-builtin-mcps             --no-ask-user             > "$BASE/condition-b-first-pass.md"

          test -s "$BASE/condition-b-first-pass.md"
          node scripts/extract-copilot-model.mjs /tmp/condition-b-otel.jsonl             > "$BASE/condition-b-model.json"

      - name: Assert same independent resolved model
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'experiments/independent-preflight-replication-08';
          const a = JSON.parse(fs.readFileSync(base + '/condition-a-model.json', 'utf8'));
          const b = JSON.parse(fs.readFileSync(base + '/condition-b-model.json', 'utf8'));

          const required = 'mai-code-1.1-flash';
          const am = a.resolvedModels;
          const bm = b.resolvedModels;

          if (am.length !== 1 || bm.length !== 1 ||
              am[0] !== required || bm[0] !== required) {
            throw new Error(
              'Replication invalid: expected both conditions to resolve to ' +
              required + '; A=' + JSON.stringify(a) + '; B=' + JSON.stringify(b)
            );
          }
          NODE

      - name: Freeze execution metadata
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          BASE="experiments/independent-preflight-replication-08"
          A_SHA="$(sha256sum "$BASE/condition-a-first-pass.md" | awk '{print $1}')"
          B_SHA="$(sha256sum "$BASE/condition-b-first-pass.md" | awk '{print $1}')"

          cat > "$BASE/first-pass-freeze.md" <<EOF
          # Independent replication 08 first-pass freeze

          Status: Frozen before scoring
          Date: 2026-09-20

          - Execution surface: GitHub Copilot CLI
          - Requested model: `auto`
          - Required resolved model: `mai-code-1.1-flash`
          - Treatment: compact preflight context only
          - Condition execution: separate stateless CLI invocations
          - Condition A SHA-256: `$A_SHA`
          - Condition B SHA-256: `$B_SHA`
          - Condition A model evidence: `condition-a-model.json`
          - Condition B model evidence: `condition-b-model.json`
          - Prompt word counts: `prompt-word-counts.txt`
          - Prior experiment outputs supplied: no
          - Scoring/preregistration supplied: no
          EOF

      - name: Commit frozen outputs
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "communication-engineering-replication"
          git config user.email "actions@users.noreply.github.com"

          git add experiments/independent-preflight-replication-08/
          git commit -m "Freeze independent compact preflight replication 08 outputs"
          git push origin HEAD:research/independent-preflight-replication-06
